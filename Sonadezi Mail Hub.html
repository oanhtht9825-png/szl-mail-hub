<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonadezi Mail Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
[data-theme=brand-dark]{--hd:#0c111b;--ht:#fff;--hl:#1c2535;--sb:#111827;--st:#e8edf7;--bg:#0b0f17;--p:#0e1420;--p2:#0c121c;--t:#e8edf7;--m:#8e9ab0;--l:#1d2638;--a:#1d6bff;--at:#fff;--h:#151e2e;--sel:#102445;--chip:#182236;--logo:#fff}
[data-theme=brand-blue]{--hd:#0b3a96;--ht:#fff;--hl:#0b3a96;--sb:#fff;--st:#1b2b46;--bg:#f4f7fc;--p:#fff;--p2:#f4f7fc;--t:#14233d;--m:#5f7089;--l:#dde5f1;--a:#1160e8;--at:#fff;--h:#eaf0fb;--sel:#e6effd;--chip:#e8f0fd;--logo:#fff}
[data-theme=brand-soft]{--hd:#fff;--ht:#14233d;--hl:#e3e9f3;--sb:#f4f7fc;--st:#14233d;--bg:#f7f9fd;--p:#fff;--p2:#f7f9fd;--t:#14233d;--m:#62738c;--l:#e3e9f3;--a:#1a62e0;--at:#fff;--h:#eef3fb;--sel:#e9f1ff;--chip:#eaf1fd;--logo:#0D4794}
[data-theme=mono-light]{--hd:#fff;--ht:#111;--hl:#e6e6e6;--sb:#f6f6f6;--st:#111;--bg:#f7f7f7;--p:#fff;--p2:#fff;--t:#161616;--m:#6d6d6d;--l:#e6e6e6;--a:#111;--at:#fff;--h:#f0f0f0;--sel:#ececec;--chip:#efefef;--logo:#111}
[data-theme=mono-dark]{--hd:#131313;--ht:#f2f2f2;--hl:#262626;--sb:#1b1b1b;--st:#eee;--bg:#101010;--p:#151515;--p2:#121212;--t:#eee;--m:#9a9a9a;--l:#262626;--a:#f2f2f2;--at:#111;--h:#1e1e1e;--sel:#262626;--chip:#222;--logo:#f2f2f2}
body{font-family:'Be Vietnam Pro',system-ui,Arial,sans-serif;background:var(--bg);color:var(--t);font-size:var(--fs,14px);line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%}
.main{flex:1;overflow:auto;padding:22px 28px;min-width:0}
.main h2{margin:0 0 4px;font-size:1.35em;font-weight:600}
.sub{color:var(--m);margin:0 0 18px}
.card{background:var(--p);border:1px solid var(--l);border-radius:8px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:1em;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:3px;font-size:.92em}
.f>span{color:var(--m)}
input[type=text],input:not([type]),select,textarea{background:var(--bg);border:1px solid var(--l);border-radius:6px;padding:7px 9px;width:100%}
.ck{display:flex;gap:8px;align-items:center;padding:4px 0}
.lock{color:var(--m);font-size:.9em;padding:4px 0}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--l);font-weight:400;vertical-align:middle}
th{color:var(--m);font-size:.9em}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--h);font-size:.85em}
.sigbox{background:#fff;color:#222;border:1px solid var(--l);border-radius:8px;padding:16px;overflow-x:auto}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.th{border:2px solid var(--l);border-radius:8px;padding:0;background:none;text-align:left;overflow:hidden}
.th.on{border-color:var(--a)}
.th i{display:block;height:64px;position:relative}
.th i::before{content:"";position:absolute;left:0;top:0;bottom:0;width:30%;background:var(--s)}
.th i::after{content:"";position:absolute;left:38%;right:8%;top:14px;height:8px;border-radius:4px;background:var(--c);box-shadow:0 16px 0 var(--c),0 32px 0 var(--c)}
.th span{display:block;padding:6px 10px;color:var(--t)}

.btn{border:1px solid var(--l);background:var(--p);color:var(--t);border-radius:6px;padding:7px 14px}
.btn.pri{background:var(--a);color:var(--at);border-color:var(--a)}
.hd{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--hd);color:var(--ht);border-bottom:1px solid var(--hl);flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:230px}
.brand svg{width:40px;height:34px;fill:var(--logo);flex:none}
.brand b{font-weight:600;font-size:1.15em;display:block;line-height:1.15}.brand small{opacity:.8;font-size:.78em}
.srch{flex:1;position:relative;max-width:640px;margin:0 auto 0 12px}
.hd .srch input{background:var(--sb);color:var(--st);border:1px solid var(--hl);padding:9px 60px 9px 12px;border-radius:8px}
.srch kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.75em;color:var(--m);border:1px solid var(--l);border-radius:4px;padding:0 6px}
.hd select.hs{background:var(--sb);color:var(--st);border:1px solid var(--hl);width:auto;padding:8px 10px}
.ic2{background:none;border:1px solid transparent;color:var(--ht);font-size:1.2em;border-radius:6px;padding:4px 9px}
.ic2:hover{border-color:var(--hl)}
.usr{display:flex;align-items:center;gap:10px}.usr small{display:block;opacity:.75;font-size:.8em}.usr b{font-weight:500;display:block;line-height:1.2}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:600;font-size:.85em;background:var(--a);color:var(--at)}
.wrap{flex:1;display:flex;min-height:0}
.nav{width:250px;flex:none;background:var(--p2);border-right:1px solid var(--l);padding:14px 10px;overflow:auto}
.nav .newbtn{width:100%;padding:11px;margin-bottom:12px;font-weight:500;border-radius:8px}
.nav h4{margin:16px 10px 4px;font-size:.78em;font-weight:500;color:var(--m);text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.nav a:hover{background:var(--h)}.nav a.on{background:var(--sel);font-weight:500;box-shadow:inset 3px 0 0 var(--a)}
.nav .gl{width:18px;text-align:center;color:var(--m)}.nav a.on .gl{color:var(--a)}
.nav em{margin-left:auto;font-style:normal;background:var(--chip);border-radius:99px;padding:0 8px;font-size:.85em}
.area{flex:1;display:flex;min-width:0}
.area.bottom{flex-direction:column}.area.bottom .lst{width:auto;height:46%;border-right:0;border-bottom:1px solid var(--l)}
.area.off .det{display:none}.area.off.cm .det{display:block;flex:1}.area.off.cm .lst{display:none}.cmp h2{margin:0 0 10px;font-size:1.3em}.cmp .f{margin-bottom:8px}.area.off .lst{width:100%;flex:1}
.lst{width:410px;flex:none;display:flex;flex-direction:column;background:var(--p);border-right:1px solid var(--l);min-height:0}
.lh{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 16px 6px}.lh h3{margin:0;font-size:1.4em;font-weight:600}.lh small,.lh span{color:var(--m)}
.mvsel{display:none}
.chips{display:flex;gap:8px;padding:6px 16px}
.chips button,.fl select{border:1px solid var(--l);background:var(--p);color:var(--t);border-radius:8px;padding:5px 12px}
.chips button.on{background:var(--a);color:var(--at);border-color:var(--a)}
.fl{display:flex;gap:8px;padding:6px 16px 10px;flex-wrap:wrap}.fl select{width:auto;padding:5px 8px}
.rows{overflow:auto;flex:1;border-top:1px solid var(--l)}
.row{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--l);cursor:pointer}
.row:hover{background:var(--h)}.row.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--a)}
.compact .row{padding:6px 16px}.compact .sn{display:none}
.rc{min-width:0;flex:1}.r1,.r4{display:flex;gap:8px;align-items:center}.r1 span{margin-left:auto;color:var(--m);font-size:.85em;flex:none}
.r2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sn{color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92em}
.un{font-weight:600}.r4{margin-top:4px;flex-wrap:wrap}.r4 .ow{margin-left:auto;color:var(--m);font-size:.85em}
.stc{display:inline-flex;align-items:center;border-radius:6px;padding:0 9px;font-size:.82em;background:var(--chip)}
.stc::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,#888);margin-right:6px}
.sNew{--c:#2f80ed}.sInprogress{--c:#27ae60}.sWaiting{--c:#e2a021}.sDone{--c:#8a94a6}
.pjc{border-radius:6px;padding:0 9px;font-size:.82em;background:var(--chip);color:var(--a)}
.det{flex:1;overflow:auto;padding:18px 26px;min-width:0}
.dh{display:flex;gap:12px;align-items:flex-start}.dh h2{margin:0;flex:1;font-size:1.35em;font-weight:600;line-height:1.3}
.ib{display:flex;gap:6px}.ic{border:1px solid var(--l);background:var(--p);color:var(--t);border-radius:8px;width:36px;height:36px;font-size:1.05em}
.back{display:none}
.tags{display:flex;gap:8px;margin:10px 0}.tg{border-radius:6px;padding:1px 10px;font-size:.85em;background:var(--chip)}.tg.pj{color:var(--a)}
.c2{border:1px solid var(--l);background:var(--p);border-radius:10px;padding:14px}
.sh{display:flex;gap:14px;align-items:center}.sh .av{width:48px;height:48px}.sh .tm{margin-left:auto;color:var(--m);font-size:.9em;text-align:right}
.aud{display:flex;gap:10px;align-items:center;background:var(--chip);border:1px solid var(--l);border-radius:8px;padding:9px 14px;margin:12px 0;font-size:.9em}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;border:1px solid var(--l);background:var(--p);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.ctl label{display:block;color:var(--m);font-size:.8em;text-transform:uppercase;margin-bottom:4px}
.cc{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:99px;padding:2px 4px 2px 10px;margin:0 6px 4px 0}.cc button{background:none;border:0;color:var(--m)}
.ctl select{width:auto;max-width:100%}
.msg{white-space:pre-wrap;line-height:1.7;margin:16px 0}
.ab{display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--l);padding-top:14px}
.ab .btn{padding:10px 18px}
.emp{display:grid;place-items:center;height:100%;color:var(--m)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;z-index:5}
.modal>div{background:var(--p);color:var(--t);width:min(720px,100%);max-height:94%;overflow:auto;border-radius:12px;padding:18px;border:1px solid var(--l)}
.modal h2{margin:0 0 8px}.modal .f{margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--a);color:var(--at);padding:10px 16px;border-radius:8px;z-index:9;display:flex;gap:14px;align-items:center}
.toast button{background:none;border:0;color:inherit;text-decoration:underline}
.nav.set a.back2{color:var(--m)}
@media(max-width:900px){.brand{min-width:0}.brand small,.usr div,.srch kbd{display:none}.srch{margin:0}
.nav{display:none}.nav.set{display:flex;width:auto;overflow-x:auto;padding:6px;border-right:0;border-bottom:1px solid var(--l)}.nav.set h4{display:none}.nav.set a{white-space:nowrap}
.wrap.sw{flex-direction:column}.area{flex-direction:column}.lst{width:100%;border-right:0;flex:1}.det{display:none;padding:14px}
.wrap.mob .lst{display:none}.wrap.mob .det{display:block}.back{display:inline-block;border:0;background:none;color:var(--t);font-size:1.4em;padding:0}
.mvsel{display:block;width:auto;margin:0 16px 6px}.hd{flex-wrap:wrap}.hd select.hs{padding:6px}}
</style>
</head>

function finalize(sn){const mb=MB.find(b=>b[0]===sn.from);const r=sn.ref?S.mails.find(x=>x.id===sn.ref):null;
S.mails.push({id:nid(),from:S.display,addr:mb[2],to:sn.to,sub:sn.sub||"(không tiêu đề)",body:sn.body,folder:"sent",mb:sn.from==="kinhdoanh"?"kd":"me",by:ME,owner:"",collab:[],st:"Done",proj:r?r.proj:"",ts:Date.now(),read:true,star:false,audit:[{w:ME,a:"Gửi thư",ts:Date.now()}]});
if(r){if(r.st==="New"||r.st==="In progress")r.st="Waiting";if(S.replyOwner==="me")r.owner=ME;log(r,"Đã trả lời")}
save();showToast(t("sentok"),0,3500)}
function stashDraft(){if(!modal||!(modal.to.trim()||modal.sub.trim()||(modal.mode==="new"&&modal.body.trim())))return false;const mb=MB.find(x=>x[0]===modal.from);S.mails.push({id:nid(),from:S.display,addr:mb[2],to:modal.to,sub:modal.sub||"(không tiêu đề)",body:modal.body,folder:"drafts",mb:modal.from==="kinhdoanh"?"kd":"me",by:ME,owner:"",collab:[],st:"New",proj:"",ts:Date.now(),read:true,star:false,audit:[]});save();return true}
function startSend(sn){let n=S.delay;const f=x=>t("sending")+" "+x+"s";pend=sn;toast={t:f(n),undo:true};render();clearInterval(iv);iv=setInterval(()=>{n--;if(n<=0){clearInterval(iv);toast=null;finalize(sn);return}const e=$("tt");if(e)e.textContent=f(n)},1000)}
document.addEventListener("input",e=>{const t_=e.target;
if(t_.id==="q"){ui.q=t_.value;const p=t_.selectionStart;render();const q=$("q");q.focus();q.setSelectionRange(p,p);return}
if(t_.dataset.c){modal[t_.dataset.c]=t_.value;if(t_.dataset.c==="from")render();return}
if(t_.dataset.sg){const sg=sigOf(S.selSig);sg[t_.dataset.sg]=t_.dataset.sg==="short"?t_.value==="1":t_.value;save();const p=$("sigprev");if(p)p.innerHTML=sigHTML(sg);return}
const k=t_.dataset.k;if(!k)return;let v=t_.type==="checkbox"?t_.checked:t_.dataset.n?Number(t_.value):t_.value;if(v==="true")v=true;if(v==="false")v=false;
set(S,k,v);save();if(t_.dataset.n&&t_.nextElementSibling)t_.nextElementSibling.textContent=v;
if(["name","title","dept","phone","email"].includes(k)){const p=$("sigprev");if(p)p.innerHTML=sigHTML(sigOf(S.selSig))}
if(k==="fs")document.documentElement.style.setProperty("--fs",v+"px");else if(t_.tagName==="SELECT"&&["density","pane","theme","lang"].includes(k))render()});
document.addEventListener("change",e=>{const t_=e.target,f=t_.dataset.f;if(!f)return;
if(f==="att"){modal.att=[...t_.files].map(x=>x.name);$("attl").textContent=modal.att.join(", ");return}
if(f==="fOwner")ui.owner=t_.value;else if(f==="fStatus")ui.status=t_.value;else if(f==="fProject")ui.project=t_.value;else if(f==="fDate")ui.date=t_.value;else if(f==="view")view=t_.value;
else{const m=MAIL();if(!m)return;if(f==="owner"){m.owner=t_.value;log(m,"Giao cho "+(t_.value||"(bỏ giao)"))}else if(f==="status"){m.st=t_.value;log(m,"Trạng thái → "+t_.value)}else if(f==="addc"&&t_.value){m.collab.push(t_.value);log(m,"Thêm cộng tác viên "+t_.value)}save()}
render()});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();const q=$("q");if(q)q.focus()}else if(e.key==="Escape"&&modal){modal=null;render()}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id,m=MAIL();
const leave=(a==="nav"||a==="open")&&modal;if(leave){const sv=stashDraft();modal=null;if(sv)showToast(t("draft")+" ✓",0,2200)}
if(a==="nav"){view=id;sel=null;ui.q="";ui.owner=ui.status=ui.project=ui.date="";mob=false;menu=false}
else if(a==="chip")ui.chip=id;
else if(a==="open"){sel=Number(id);const x=MAIL();x.read=true;mob=true;menu=false;if(S.autoAssign&&!x.owner&&["inbox"].includes(x.folder)){x.owner=ME;if(x.st==="New")x.st="In progress";log(x,"Tự nhận xử lý khi mở")}save()}
else if(a==="back")mob=false;
else if(a==="reply"||a==="fwd"){openCompose(a)}
else if(a==="compose"){if(!modal)openCompose("new")}
else if(a==="more")menu=!menu;
else if(a==="assignme"){m.owner=ME;if(m.st==="New")m.st="In progress";log(m,"Nhận xử lý");save()}
else if(a==="done"){m.st="Done";log(m,"Hoàn tất");save()}
else if(a==="archive"){m.folder="archive";log(m,"Lưu trữ");save()}
else if(a==="del"){if(m.folder==="deleted"){S.mails=S.mails.filter(x=>x.id!==m.id);sel=null}else{m.folder="deleted";log(m,"Xóa")}save()}
else if(a==="unread"){m.read=false;save()}
else if(a==="star"){m.star=!m.star;save()}
else if(a==="rmc"){m.collab=m.collab.filter(c=>c!==id);log(m,"Bỏ cộng tác viên "+id);save()}
else if(a==="editdraft"){modal={mode:"new",from:m.mb==="kd"?"kinhdoanh":"personal",to:m.to,cc:S.cc||"",sub:m.sub,body:m.body,att:[],ref:null};S.mails=S.mails.filter(x=>x.id!==m.id);sel=null;save()}
else if(a==="close"){modal=null;mob=false}
else if(a==="draft"){stashDraft();modal=null;mob=false;showToast(t("draft")+" ✓",0,2200);return}
else if(a==="send"){const rc=(modal.to+","+modal.cc).split(/[,;]/).map(s=>s.trim()).filter(Boolean);
if(!rc.length)return showToast(t("noto"),0,2500);
if(S.confirmExt&&rc.some(x=>!x.toLowerCase().endsWith("@szl.com.vn"))&&!confirm(t("ext")))return;
if(S.chkAtt&&/đính kèm|attach/i.test(modal.body)&&!modal.att.length&&!confirm(t("noatt")))return;
const sn=modal;modal=null;mob=false;if(S.delay>0){startSend(sn)}else finalize(sn);return}
else if(a==="undo"){clearInterval(iv);toast=null;modal=pend;mob=true}
else if(a==="test"){const x=INC[ii++%INC.length];const n=mk(nid(),x[0],x[1],x[2],x[3],{ts:Date.now()});applyRules(n);S.mails.push(n);save();showToast((S.lang==="vi"?"Có thư mới từ ":"New mail from ")+x[0]+(n.proj?" → "+n.proj:""),0,3500);return}
else if(a==="gear"){page="account"}else if(a==="mailpage")page="mail";else if(a==="page")page=id;
else if(a==="theme"){S.theme=id;save()}
else if(a==="selSig")S.selSig=Number(id);
else if(a==="addSig"){const n=Math.max(...S.sigs.map(s=>s.id))+1;S.sigs.push({id:n,name:"Chữ ký mới "+n,lang:"vi",short:false});S.selSig=n;save()}
else if(a==="delSig"){S.sigs=S.sigs.filter(s=>s.id!==Number(id));S.selSig=S.sigs[0].id;for(const k in S.sm)for(const j in S.sm[k])if(!S.sigs.find(s=>String(s.id)===S.sm[k][j]))S.sm[k][j]=String(S.sigs[0].id);save()}
else if(a==="addRule"){const v=$("rv").value.trim(),av=$("rav").value.trim();if(!v||!av)return showToast("Điền đủ giá trị điều kiện và hành động.",0,2500);S.rules.push({f:$("rf").value,v,a:$("ra").value,av});save()}
else if(a==="delRule"){S.rules.splice(Number(id),1);save()}
else if(a==="addProj"){const v=$("np").value.trim();if(v&&!S.projects.includes(v)){S.projects.push(v);save()}}
else if(a==="reset"){S=mkDef();save();view="s-in";sel=null}
render()});
render();
</script>
</body>
</html>
